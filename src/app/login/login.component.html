<div class="login-page">
  <div class="login-card">

    <!-- Header verde -->
    <div class="login-header">
      <div class="header-circles">
        <span class="circle circle-tl"></span>
        <span class="circle circle-br"></span>
      </div>
      <div class="header-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle"
            font-size="18" font-weight="700" fill="#1a6e2e" font-family="Roboto, sans-serif">$</text>
        </svg>
      </div>
      <h1 class="brand-title">
        MiDinero<span class="brand-ia">IA</span>
      </h1>
      <p class="brand-subtitle">Tu asistente financiero inteligente</p>
    </div>

    <!-- Formulario -->
    <div class="login-body">
      <h2 class="welcome-title">Bienvenido de nuevo</h2>
      <p class="welcome-subtitle">Inicia sesión para continuar</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email -->
        <div class="field-group">
          <label class="field-label" for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <!-- Envelope icon -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input
              id="email"
              type="email"
              class="input-field"
              formControlName="email"
              placeholder="ejemplo@correo.com"
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Contraseña -->
        <div class="field-group">
          <label class="field-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <!-- Lock icon -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="input-field input-field--password"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <!-- Eye icon -->
              <svg *ngIf="!showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye-off icon -->
              <svg *ngIf="showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Olvidé contraseña -->
        <div class="forgot-row">
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Mensaje de error -->
        @if (errorMessage()) {
          <div class="error-message">
            {{ errorMessage() }}
          </div>
        }

        <!-- Botón submit -->
        <button type="submit" class="btn-submit" [disabled]="isLoading()">
          @if (isLoading()) {
            Iniciando...
          } @else {
            Iniciar sesión
          }
        </button>

      </form>

      <!-- Separador -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">o continúa con</span>
        <span class="divider-line"></span>
      </div>

      <!-- Google -->
      <button type="button" class="btn-google" (click)="onGoogleLogin()">
        <!-- Google G logo -->
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Google</span>
      </button>

      <!-- Registro -->
      <p class="register-text">
        ¿No tienes cuenta?&nbsp;<a routerLink="/register" class="register-link">Crear cuenta</a>
      </p>
    </div>

  </div>
</div>
