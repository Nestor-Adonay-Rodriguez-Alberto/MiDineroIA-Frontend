<div class="signup-page">
  <div class="signup-card">

    <!-- ── Header verde ──────────────────────────────── -->
    <div class="signup-header">
      <div class="signup-header__circles">
        <span class="signup-header__circle signup-header__circle--tr"></span>
        <span class="signup-header__circle signup-header__circle--bl"></span>
      </div>
      <div class="signup-header__icon">
        <svg width="32" height="32" viewBox="0 0 24 24">
          <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle"
            font-size="20" font-weight="600" fill="#1B5E20" font-family="Roboto,sans-serif">$</text>
        </svg>
      </div>
      <h1 class="signup-header__title">MiDineroIA</h1>
    </div>

    <!-- ── Formulario ────────────────────────────────── -->
    <div class="signup-body">
      <h2 class="signup-title">Crear cuenta</h2>
      <p class="signup-subtitle">Comienza a gestionar tus finanzas hoy</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <!-- Nombre + Apellido (fila) -->
        <div class="signup-row">

          <div class="signup-field">
            <label class="signup-label" for="nombre">Nombre</label>
            <div class="signup-input-wrap">
              <span class="signup-input-icon">
                <!-- Person icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input id="nombre" type="text" class="signup-input"
                formControlName="nombre" placeholder="Juan" autocomplete="given-name"/>
            </div>
          </div>

          <div class="signup-field">
            <label class="signup-label" for="apellido">Apellido</label>
            <div class="signup-input-wrap signup-input-wrap--no-icon">
              <input id="apellido" type="text" class="signup-input signup-input--no-icon"
                formControlName="apellido" placeholder="Pérez" autocomplete="family-name"/>
            </div>
          </div>

        </div>

        <!-- Correo electrónico -->
        <div class="signup-field signup-field--full">
          <label class="signup-label" for="email">Correo electrónico</label>
          <div class="signup-input-wrap">
            <span class="signup-input-icon">
              <!-- Envelope icon -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input id="email" type="email" class="signup-input"
              formControlName="email" placeholder="juan@ejemplo.com" autocomplete="email"/>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="signup-field signup-field--full">
          <label class="signup-label" for="password">Contraseña</label>
          <div class="signup-input-wrap">
            <span class="signup-input-icon">
              <!-- Lock icon -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="password" [type]="showPassword() ? 'text' : 'password'"
              class="signup-input signup-input--with-toggle"
              formControlName="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
            <button type="button" class="signup-toggle" (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar' : 'Mostrar'">
              <svg *ngIf="!showPassword()" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword()" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirmar contraseña -->
        <div class="signup-field signup-field--full">
          <label class="signup-label" for="confirmPassword">Confirmar contraseña</label>
          <div class="signup-input-wrap">
            <span class="signup-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="confirmPassword" [type]="showConfirm() ? 'text' : 'password'"
              class="signup-input"
              formControlName="confirmPassword" placeholder="Repetir contraseña" autocomplete="new-password"/>
          </div>
        </div>

        <!-- Términos -->
        <div class="signup-terms">
          <div class="signup-terms__checkbox-wrap">
            <input type="checkbox" id="terms" formControlName="terms" class="signup-terms__input"/>
            <span class="signup-terms__custom" [class.signup-terms__custom--checked]="form.get('terms')?.value">
              <svg *ngIf="form.get('terms')?.value" width="10" height="8" viewBox="0 0 10 8" fill="none">
                <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
          <label for="terms" class="signup-terms__label">
            Acepto los <a href="#" class="signup-terms__link">Términos de servicio</a> y la
            <a href="#" class="signup-terms__link">Política de privacidad</a>
          </label>
        </div>

        <!-- Botón submit -->
        <button type="submit" class="signup-btn-submit">
          Crear mi cuenta
        </button>

      </form>

      <!-- Divider -->
      <div class="signup-divider">
        <span class="signup-divider__line"></span>
        <span class="signup-divider__text">o regístrate con</span>
        <span class="signup-divider__line"></span>
      </div>

      <!-- Google -->
      <button type="button" class="signup-btn-google" (click)="onGoogleRegister()">
        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Google</span>
      </button>

      <!-- Login link -->
      <p class="signup-login-text">
        ¿Ya tienes cuenta?&nbsp;<a routerLink="/login" class="signup-login-link">Iniciar sesión</a>
      </p>

    </div>
  </div>
</div>
