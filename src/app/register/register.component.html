<div class="auth-page">

  <!-- ── Brand Panel ──────────────────────────────────── -->
  <div class="auth-brand-panel">
    <span class="auth-brand-circle auth-brand-circle--1"></span>
    <span class="auth-brand-circle auth-brand-circle--2"></span>
    <span class="auth-brand-circle auth-brand-circle--3"></span>
    <span class="auth-brand-circle auth-brand-circle--4"></span>

    <div class="auth-brand-content">
      <div class="auth-brand-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle"
            font-size="18" font-weight="700" fill="#1B5E20" font-family="Roboto, sans-serif">$</text>
        </svg>
      </div>
      <h1 class="auth-brand-title">
        MiDinero<span class="auth-brand-ia">IA</span>
      </h1>
      <p class="auth-brand-tagline">Tu asistente financiero inteligente</p>

      <div class="auth-brand-features">
        <span class="auth-feature-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          Control de gastos
        </span>
        <span class="auth-feature-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9"/>
            <path d="M21 3v6h-6"/>
          </svg>
          Presupuestos IA
        </span>
        <span class="auth-feature-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <path d="m19 9-5 5-4-4-3 3"/>
          </svg>
          Reportes inteligentes
        </span>
      </div>
    </div>
  </div>

  <!-- ── Form Panel ───────────────────────────────────── -->
  <div class="auth-form-panel">
    <div class="auth-form-container">
      <h2 class="auth-heading">Crear cuenta</h2>
      <p class="auth-subheading">Comienza a gestionar tus finanzas hoy</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <!-- Nombre + Apellido -->
        <div class="auth-row">
          <div class="auth-field">
            <label class="auth-label" for="nombre">Nombre</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="#8e9d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input id="nombre" type="text" class="auth-input"
                formControlName="nombre" placeholder="Juan" autocomplete="given-name"/>
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="apellido">Apellido</label>
            <div class="auth-input-wrap">
              <input id="apellido" type="text" class="auth-input auth-input--no-icon"
                formControlName="apellido" placeholder="Pérez" autocomplete="family-name"/>
            </div>
          </div>
        </div>

        <!-- Correo electrónico -->
        <div class="auth-field">
          <label class="auth-label" for="email">Correo electrónico</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#8e9d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input id="email" type="email" class="auth-input"
              formControlName="email" placeholder="juan&#64;ejemplo.com" autocomplete="email"/>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="auth-field">
          <label class="auth-label" for="password">Contraseña</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#8e9d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="password" [type]="showPassword() ? 'text' : 'password'"
              class="auth-input auth-input--with-toggle"
              formControlName="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
            <button type="button" class="auth-toggle" (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#8e9d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#8e9d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirmar contraseña -->
        <div class="auth-field">
          <label class="auth-label" for="confirmPassword">Confirmar contraseña</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#8e9d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="confirmPassword" [type]="showConfirm() ? 'text' : 'password'"
              class="auth-input auth-input--with-toggle"
              formControlName="confirmPassword" placeholder="Repetir contraseña" autocomplete="new-password"/>
            <button type="button" class="auth-toggle" (click)="toggleConfirm()"
              [attr.aria-label]="showConfirm() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!showConfirm()" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#8e9d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showConfirm()" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="#8e9d92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Términos -->
        <div class="auth-terms">
          <div class="auth-terms__checkbox-wrap">
            <input type="checkbox" id="terms" formControlName="terms" class="auth-terms__input"/>
            <span class="auth-terms__custom" [class.auth-terms__custom--checked]="form.get('terms')?.value">
              <svg *ngIf="form.get('terms')?.value" width="10" height="8" viewBox="0 0 10 8" fill="none">
                <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
          <label for="terms" class="auth-terms__label">
            Acepto los <a href="#" class="auth-terms__link">Términos de servicio</a> y la
            <a href="#" class="auth-terms__link">Política de privacidad</a>
          </label>
        </div>

        <!-- Mensaje de error -->
        @if (errorMessage()) {
          <div class="auth-error">
            {{ errorMessage() }}
          </div>
        }

        <!-- Botón submit -->
        <button type="submit" class="auth-btn-submit" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="auth-btn-spinner"></span>
            Creando cuenta...
          } @else {
            Crear mi cuenta
          }
        </button>

      </form>

      <!-- Login link -->
      <p class="auth-alt-action">
        ¿Ya tienes cuenta?&nbsp;<a routerLink="/login" class="auth-alt-link">Iniciar sesión</a>
      </p>
    </div>
  </div>

</div>
